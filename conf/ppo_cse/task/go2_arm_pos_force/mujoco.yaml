# @package _global_
training:
  task_name: Go2ArmPosForce
  sim_backend: mujoco
algo:
  num_envs: 128
  max_iterations: 6000
  num_one_step_obs: 76          # actor single-step obs dim
  num_actor_history: 32         # must match env.history.num_actor_history
  num_critic_history: 1
  empirical_normalization: false
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-2
  estimator:
    target_start: 0             # CSE targets at the front of the 1-step critic obs
reward:
  tracking_sigma: 0.25
  tracking_ee_sigma: 1.0
  base_height_target: 0.40
  soft_torque_limit: 0.9
  sigma_force: 0.02
  scales:
    # force/position tracking (the unified objective)
    tracking_lin_vel_force_world: 2.0
    tracking_ee_force_world: 2.0
    tracking_ang_vel: 1.0
    # gait reference + survival
    ref_dof_leg: 1.0
    alive: 1.5
    # locomotion regularization
    lin_vel_z: -1.5
    ang_vel_xy: -0.02
    dof_vel: -8.0e-4
    action_rate: -0.02
    torques: -5.0e-6
    base_height: -2.0
    hip_pos: -0.5
    torque_limits: -0.005
env:
  history:
    num_actor_history: 32
    num_critic_history: 1
  commands:
    force_start_step: 6000
  domain_rand:
    push_robots: true
    push_interval: 400
    max_force: [0.3, 0.3, 0.0]
