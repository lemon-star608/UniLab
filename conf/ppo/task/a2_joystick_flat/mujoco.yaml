# @package _global_
# A2 (leg-only Unitree A2) joystick flat task. Same isomorphic task as
# Go2JoystickFlat: 12-DOF velocity tracking with a gait phase. Robot identity
# (asset path, standing height 0.465, A2 leg PD gains) lives in A2JoystickCfg;
# this YAML carries training + reward only, mirroring the Go2 task.
training:
  task_name: A2JoystickFlat
  sim_backend: mujoco
algo:
  num_envs: 1024
  max_iterations: 500   # A2 (19.6 kg, ~2.8x Go2) + full DR needs more budget than Go2's 151; 500 validated to converge (ep-len 1000, tracking_lin_vel ~0.98).
  empirical_normalization: true
  obs_groups:
    actor:
      - actor
  policy:
    init_noise_std: 0.5
  algorithm:
    learning_rate: 3.0e-4
    entropy_coef: 1.0e-3
env:
  # Domain randomization for sim2real deployment. Uses the switches supported
  # by Go2JoystickDomainRandomizationProvider (which A2JoystickFlatEnv reuses).
  # That provider does not cache body-mass / geom-friction / dof-armature
  # baselines, so randomize_body_mass / randomize_ground_friction /
  # randomize_dof_armature are off. Ranges are calibrated to A2's 19.6 kg
  # chassis. gravity is OFF (constant on flat ground).
  # env.domain_rand is sim2sim ALLOWLIST (free override).
  domain_rand:
    randomize_base_mass: true
    added_mass_range: [0.0, 8.0]

    randomize_body_mass: false   # Go2JoystickDomainRandomizationProvider does not cache base_body_mass
    body_mass_multiplier_range: [0.9, 1.1]

    random_com: true
    com_offset_x: [-0.08, 0.08]
    com_offset_y: [-0.08, 0.08]
    com_offset_z: [-0.08, 0.08]

    randomize_gravity: false   # flat ground: gravity constant on the real robot; randomizing only slows training.

    randomize_ground_friction: false   # Go2JoystickDomainRandomizationProvider does not cache geom friction
    ground_friction_multiplier_range: [0.5, 1.8]

    randomize_dof_armature: false   # Go2JoystickDomainRandomizationProvider does not cache dof armature
    dof_armature_multiplier_range: [0.8, 1.2]

    randomize_kp: true
    kp_multiplier_range: [0.9, 1.1]

    randomize_kd: true
    kd_multiplier_range: [0.9, 1.1]

    push_robots: true
    push_interval: 400          # control steps between base velocity pushes
    max_force: [1.0, 1.0, 0.5]
    push_body_name: base_link   # A2 base body (Go2 uses "base"); required or push has no target.
reward:
  scales:
    tracking_lin_vel: 1.0
    tracking_ang_vel: 0.2
    lin_vel_z: -5.0
    ang_vel_xy: -0.1
    base_height: -100.0
    action_rate: -0.005
    similar_to_default: -0.1
    contact: 0.24
    swing_feet_z: 4.0
  tracking_sigma: 0.25
  base_height_target: 0.45
